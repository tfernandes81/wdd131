<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ACME Wildwest Services</title>
  <style>
    table {
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      text-align: center;
      width: 520px;
    }

    caption {
      caption-side: bottom;
      padding: 10px;
      font-size: 1.2rem;
      color: #555;
    }

    thead tr:first-child th {
      background-color: #000;
      color: #fff;
      font-size: 1.4rem;
      padding: 20px 0 10px;
    }

    thead tr:last-child th:first-child {
      background-color: #000;
    }

    thead tr:last-child th:not(:first-child) {
      background-color: #444;
      color: #fff;
      font-size: 1.3rem;
      padding: 15px;
    }

    tbody th,
    tbody td {
      padding: 8px 15px;
      font-size: 1.3rem;
    }

    tbody tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <table>
    <caption>Tabela 1: Comparação de Recursos da Conta</caption>
    <thead>
      <tr>
        <th colspan="4">ACME Wildwest Services</th>
      </tr>
      <tr>
        <th></th>
        <th>Básico</th>
        <th>Premium</th>
        <th>Deluxe</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>Recurso 1</th>
        <td>✔️</td>
        <td>✔️</td>
        <td>✔️</td>
      </tr>
      <tr>
        <th>Recurso 2</th>
        <td>❌</td>
        <td>✔️</td>
        <td>✔️</td>
      </tr>
      <tr>
        <th>Recurso 3</th>
        <td>❌</td>
        <td>❌</td>
        <td>✔️</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
